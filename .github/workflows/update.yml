name: Update holiday data
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add api/getallconfig.ashx
          if git diff --cached --quiet -- api/getallconfig.ashx; then echo "no change"; exit 0; fi
          # only commit when the holiday data itself changed (ignore timestamp)
          if ! python3 -c "
          import json,subprocess,sys
          new=json.load(open('api/getallconfig.ashx'))['msg']
          try: old=json.loads(subprocess.check_output(['git','show','HEAD:api/getallconfig.ashx']))['msg']
          except Exception: old=None
          sys.exit(0 if old!=new else 1)
          "; then echo "data same"; exit 0; fi
          git commit -m "Update holiday data"
          git push
          curl -s "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/api/getallconfig.ashx" || true
